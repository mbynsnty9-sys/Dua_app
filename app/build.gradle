plugins { id 'com.android.application' }

android {
    namespace 'ir.mahdi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.mahdi.app'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '2.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
